<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Манай төсөв</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <h1>Манай төсөв</h1>
    <!-- Сар сонгогч: бүх таб энэ сарын өгөгдлийг харуулна -->
    <div class="month-picker">
      <button type="button" id="month-prev" class="month-btn" aria-label="Өмнөх сар">‹</button>
      <span id="month-label" class="month-label" aria-live="polite"></span>
      <button type="button" id="month-next" class="month-btn" aria-label="Дараагийн сар">›</button>
    </div>
  </header>

  <!-- Таб товчнууд: утсан дээр доод талд, компьютер дээр дээд талд -->
  <nav class="tabs" role="tablist" aria-label="Үндсэн цэс">
    <button class="tab" role="tab" data-tab="summary" aria-selected="true">Хураангуй</button>
    <button class="tab" role="tab" data-tab="transactions" aria-selected="false">Гүйлгээ</button>
    <button class="tab" role="tab" data-tab="budget" aria-selected="false">Төсөв</button>
    <button class="tab" role="tab" data-tab="settings" aria-selected="false">Тохиргоо</button>
  </nav>

  <!-- Таб бүрийн агуулга. Одоогоор зөвхөн «Удахгүй» гэсэн бичигтэй. -->
  <main class="content">
    <section class="panel" id="panel-summary" role="tabpanel">
      <h2>Хураангуй</h2>

      <!-- Сарын нийт дүн (F4) -->
      <div class="cards">
        <div class="card">
          <span class="card-label">Орлого</span>
          <span id="sum-income" class="card-value income"></span>
        </div>
        <div class="card">
          <span class="card-label">Зарлага</span>
          <span id="sum-expense" class="card-value expense"></span>
        </div>
        <div class="card card-wide">
          <span class="card-label">Үлдэгдэл</span>
          <span id="sum-balance" class="card-value"></span>
        </div>
      </div>

      <!-- Графикууд (F6) -->
      <h3>Зарлага ангиллаар</h3>
      <div id="chart-categories" class="chart"></div>

      <h3>Сүүлийн 6 сар</h3>
      <div id="chart-trend" class="chart"></div>

      <h3>Сүүлийн гүйлгээ</h3>
      <ul id="recent-list" class="tx-list"></ul>
    </section>
    <section class="panel" id="panel-transactions" role="tabpanel" hidden>
      <h2>Гүйлгээ</h2>

      <!-- Шүүлтүүрүүд (F7). Сарыг дээд талын сар сонгогчоор сонгоно. Хоосон утга = бүгд. -->
      <div class="filters">
        <label class="field">Төрөл
          <select id="filter-type">
            <option value="">Бүгд</option>
            <option value="expense">Зарлага</option>
            <option value="income">Орлого</option>
          </select>
        </label>
        <label class="field">Ангилал
          <select id="filter-category"></select>
        </label>
        <label class="field filter-search">Хайх
          <input type="search" id="filter-search" placeholder="Тайлбараас хайх">
        </label>
      </div>

      <p id="tx-count" class="muted"></p>
      <ul id="tx-list" class="tx-list"></ul>
    </section>
    <section class="panel" id="panel-budget" role="tabpanel" hidden>
      <h2>Төсөв</h2>
      <p class="placeholder">Удахгүй</p>
    </section>
    <section class="panel" id="panel-settings" role="tabpanel" hidden>
      <h2>Тохиргоо</h2>
      <p class="placeholder">Удахгүй</p>
    </section>
  </main>

  <!-- «+» товч: бүх дэлгэц дээр гүйлгээ нэмэх цонх нээнэ -->
  <button type="button" id="add-btn" class="fab" aria-label="Гүйлгээ нэмэх">+</button>

  <!-- Гүйлгээ нэмэх / засах цонх (F1, F2) -->
  <dialog id="tx-dialog" class="dialog">
    <form id="tx-form" novalidate>
      <h2 id="tx-dialog-title">Гүйлгээ нэмэх</h2>

      <!-- Орлого / зарлага солих салгуур -->
      <div class="type-switch" role="radiogroup" aria-label="Төрөл">
        <label class="expense"><input type="radio" name="type" value="expense" checked><span>Зарлага</span></label>
        <label class="income"><input type="radio" name="type" value="income"><span>Орлого</span></label>
      </div>

      <label class="field">Дүн (₮)
        <input name="amount" class="amount-input" inputmode="numeric" autocomplete="off" placeholder="0">
      </label>
      <label class="field">Огноо
        <input type="date" name="date">
      </label>
      <label class="field">Ангилал
        <select name="categoryId"></select>
      </label>
      <label class="field">Тайлбар
        <input name="note" maxlength="200" autocomplete="off" placeholder="Заавал биш">
      </label>

      <div id="tx-errors" class="form-errors" role="alert" hidden></div>

      <div class="dialog-actions">
        <button type="button" id="tx-delete" class="btn btn-danger" hidden>Устгах</button>
        <span class="spacer"></span>
        <button type="button" id="tx-cancel" class="btn">Болих</button>
        <button type="submit" class="btn btn-primary">Хадгалах</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
